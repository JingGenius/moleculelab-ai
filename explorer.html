<html lang="en">

<title>Molecular Explorer · MoleculeLab AI</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1319;--panel:#161e28;--ink:#e8eef6;--mute:#93a1b2;--line:#2a3745;--acc:#7c93ff;--acc2:#3fd0e3;--accbg:rgba(124,147,255,.12);--warn:#f1c36b;--warnbg:#2e2412;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
header a{color:var(--mute);text-decoration:none;font:600 15px ui-monospace,Consolas,monospace}
header span{flex:1;color:var(--acc);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;color:var(--mute);padding:5px 12px;font:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--panel)}
main{max-width:1100px;margin:0 auto;padding:26px 22px 60px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:230px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
.search select{padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.go,.sm{border:0;border-radius:10px;background:var(--acc);color:var(--panel);font:inherit;font-weight:600;cursor:pointer}
.go{padding:0 26px;height:48px}.sm{padding:6px 14px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#msg{margin:16px 0;color:var(--mute)}#msg.err{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.card h3{margin:0 0 10px;font-size:15px}
.head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.head h2{margin:0;font-size:26px;font-weight:600}
.badge{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--accbg);color:var(--acc);font-weight:600}
.mono{font:13px ui-monospace,Consolas,monospace;color:var(--mute);word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.v{height:300px;background:#fff;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;color:#5b6878;text-align:center;padding:12px}
.v svg{width:100%;height:100%}.v svg rect:first-of-type{fill:transparent!important}
.bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 12px;border-radius:99px;font:inherit;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg);color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}th{font-size:13px;color:var(--mute);font-weight:600}td{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}.warn{background:var(--warnbg);color:var(--warn);padding:9px 12px;border-radius:8px;font-size:14px;margin-top:16px}
.cand{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.cand:last-child{border:0}
@media (max-width:760px){.two{grid-template-columns:1fr}header{padding:12px 16px}main{padding:20px 14px 50px}}
</style>
</head>

async function load3d(){var c=cur;if(!c||!c.cid||c.cls==='ionic'||c.cls==='metal')return;
try{var r=await fetch(PUG+'/compound/cid/'+c.cid+'/record/SDF?record_type=3d');if(!r.ok)throw 0;c.sdf=await r.text();if(cur===c)show3d()}catch(e){if(cur===c&&$('v3'))$('v3').textContent=L[lang].no3d}}
function show3d(){var el=$('v3');if(!el||!cur.sdf||typeof $3Dmol==='undefined')return;el.innerHTML='';v3=$3Dmol.createViewer(el,{backgroundColor:'white'});v3.addModel(cur.sdf,'sdf');sty();v3.zoomTo();v3.render()}
function sty(){if(!v3)return;var s={bs:{stick:{radius:.14},sphere:{scale:.26}},st:{stick:{radius:.18}},ln:{line:{}}}[m3];v3.setStyle({},s);v3.render()}
function lbl(){var t=L[lang];$('ttl').textContent=t.ttl;$('q').placeholder=t.ph;$('go').textContent=t.go;
var ty=$('ty'),v=ty.value||'auto';ty.innerHTML=['auto','name','formula','smiles'].map(function(k,i){return '<option value="'+k+'">'+t.ty[i]+'</option>'}).join('');ty.value=v;
document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===lang)});document.documentElement.lang=lang==='zh'?'zh-CN':'en'}
document.addEventListener('click',function(e){var b;
if((b=e.target.closest('[data-cid]'))){say(L[lang].load);loadCid(+b.dataset.cid).then(function(){say('')}).catch(function(x){say(L[lang].nonet+x.message,1)})}
else if((b=e.target.closest('[data-g]'))){hlg=hlg===b.dataset.g?null:b.dataset.g;render()}
else if((b=e.target.closest('[data-m]'))){m3=b.dataset.m;document.querySelectorAll('[data-m]').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.m===m3)});sty()}
else if((b=e.target.closest('[data-l]'))){lang=b.dataset.l;try{localStorage.setItem('ml-lang',lang)}catch(x){}lbl();drawCands();render();if(cur&&cur.sdf)show3d()}});
$('go').onclick=function(){run($('q').value,$('ty').value)};$('q').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
lbl();var P=new URLSearchParams(location.search);if(P.get('q')){$('q').value=P.get('q');run(P.get('q'),'auto')}
</script>
</body>
</html>
